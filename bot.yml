name: Price Bot - Bale

on:
  schedule:
    # ┌───────────── minute
    # │ ┌─────────── hour (UTC)
    # │ │ ┌───────── day
    # │ │ │ ┌─────── month
    # │ │ │ │ ┌───── weekday
    # * * * * *
    
    # اجرا از 6 صبح تا 12 شب (به وقت ایران)
    # UTC = ایران - 3:30
    # 06:00 - 3:30 = 02:30
    # 07:30 - 3:30 = 04:00
    # 09:00 - 3:30 = 05:30
    # 10:30 - 3:30 = 07:00
    # 12:00 - 3:30 = 08:30
    # 13:30 - 3:30 = 10:00
    # 15:00 - 3:30 = 11:30
    # 16:30 - 3:30 = 13:00
    # 18:00 - 3:30 = 14:30
    # 19:30 - 3:30 = 16:00
    # 21:00 - 3:30 = 17:30
    
    - cron: '30 2,4 5:30,7 8:30,10 11:30,13 14:30,16 17:30 * * *'
    
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_LINK: ${{ secrets.CHANNEL_LINK }}
          AD_LINK: ${{ secrets.AD_LINK }}
        run: python bot.py
